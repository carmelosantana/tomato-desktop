<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomato — break</title>
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        color: var(--text);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 10px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
        padding: 30px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        animation: card-in var(--duration-card-in) var(--ease-out);
      }
      @keyframes card-in {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .meta {
        align-self: stretch;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-muted);
        font-family: var(--font-mono);
      }
      .dial {
        position: relative;
        width: 172px;
        height: 172px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 8px 0 4px;
      }
      .dial svg {
        position: absolute;
        inset: 0;
      }
      .dial .readout {
        text-align: center;
      }
      .count {
        font-family: var(--font-mono);
        font-size: var(--size-timer);
        font-weight: var(--weight-semibold);
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        line-height: 1;
      }
      .of {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .lede {
        font-size: 14px;
        color: var(--text-muted);
        text-align: center;
        max-width: 280px;
        line-height: var(--lh-normal);
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        align-self: stretch;
      }
      button {
        flex: 1;
        font-family: var(--font-display);
        font-size: 14px;
        border-radius: var(--radius-md);
        padding: 12px;
        cursor: pointer;
      }
      #skip {
        font-weight: var(--weight-semibold);
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border);
      }
      #break-now {
        font-weight: var(--weight-bold);
        color: #fff;
        background: var(--break);
        border: none;
      }
      #break-now[hidden] {
        display: none;
      }
      button:hover {
        filter: brightness(1.03);
      }
    </style>
  </head>
  <body>
    <div class="card" role="dialog" aria-label="Break">
      <div class="meta">
        <span>◼ BREAK</span>
        <span>▲ pinned</span>
      </div>
      <div class="dial">
        <svg width="172" height="172" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" stroke-width="9" stroke-dasharray="2.5 8" stroke-linecap="round" />
          <circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--break)" stroke-width="9" stroke-linecap="round" stroke-dasharray="327 327" stroke-dashoffset="0" transform="rotate(-90 60 60)" />
        </svg>
        <div class="readout">
          <div class="count" id="break-time">--:--</div>
          <div class="of">of <span id="break-total">5:00</span> rest</div>
        </div>
      </div>
      <div class="lede">Time to step away. Your break will end on its own.</div>
      <div class="actions">
        <button id="skip" type="button">Skip</button>
        <button id="break-now" type="button" hidden>Break now</button>
      </div>
    </div>
    <script type="module" src="./break-card.ts"></script>
  </body>
</html>
