<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomato — settings</title>
    <!-- Critical: paint the themed background on first frame so the webview
         never flashes white before the external stylesheets load. -->
    <style>
      html { background: #f7f3ee; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { html { background: #171310; } }
    </style>
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/settings.css" />
  </head>
  <body>
    <div class="card">
      <div class="card-head">Settings</div>

      <div class="rows">
        <!-- Sprint length -->
        <div class="row">
          <div class="row-text">
            <div class="row-title">Sprint length</div>
            <div class="row-sub">60 s – 60 min</div>
          </div>
          <div class="field">
            <input
              id="sprint"
              class="num"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              aria-label="Sprint length in minutes"
            />
            <span class="unit">min</span>
          </div>
        </div>

        <!-- Break length -->
        <div class="row">
          <div class="row-text">
            <div class="row-title">Break length</div>
            <div class="row-sub">30 s – 30 min</div>
          </div>
          <div class="field">
            <input
              id="break"
              class="num"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              aria-label="Break length in minutes"
            />
            <span class="unit">min</span>
          </div>
        </div>

        <!-- Grace window -->
        <div class="row">
          <div class="row-text">
            <div class="row-title">Grace window</div>
            <div class="row-sub">wrap-up after boundary · 0 – 10 min</div>
          </div>
          <div class="field">
            <input
              id="grace"
              class="num"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              aria-label="Grace window in minutes"
            />
            <span class="unit">min</span>
          </div>
        </div>

        <!-- Enforcement -->
        <div class="row">
          <div class="row-text">
            <div class="row-title">Enforcement</div>
            <div class="row-sub">how firmly the break is pushed</div>
          </div>
          <div
            class="segmented"
            id="mode"
            role="radiogroup"
            aria-label="Enforcement mode"
          >
            <button type="button" class="seg" data-mode="enforced" role="radio" aria-checked="true">
              Enforced
            </button>
            <button type="button" class="seg" data-mode="soft" role="radio" aria-checked="false">
              Soft
            </button>
          </div>
        </div>

        <!-- Autostart -->
        <div class="row last">
          <div class="row-text">
            <div class="row-title">Autostart on login</div>
            <div class="row-sub">launch Tomato with your session</div>
          </div>
          <button
            type="button"
            class="toggle"
            id="autostart"
            role="switch"
            aria-checked="false"
            aria-label="Autostart on login"
          >
            <span class="knob"></span>
          </button>
        </div>
      </div>

      <div class="foot">
        <div class="foot-msg" id="msg" role="status" aria-live="polite"></div>
        <button type="button" class="btn ghost" id="cancel">Cancel</button>
        <button type="button" class="btn primary" id="save">Save</button>
      </div>
    </div>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
