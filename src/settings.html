<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomato — settings</title>
    <!-- Critical: paint the themed background on first frame so the webview
         never flashes white before the external stylesheets load. -->
    <style>
      html { background: #f7f3ee; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { html { background: #171310; } }
    </style>
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/settings.css" />
  </head>
  <body>
    <div class="card">
      <div class="card-head">Settings</div>

      <div class="rows">
        <!-- Sprint length -->
        <div class="row">
          <div class="row-text">
            <div class="row-title">Sprint length</div>
            <div class="row-sub">1–60 min</div>
          </div>
          <div class="field">
            <input
              id="sprint"
              class="num"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              aria-label="Sprint length in minutes"
            />
            <span class="unit">min</span>
          </div>
        </div>

        <!-- Reset after idle -->
        <div class="row">
          <div class="row-text">
            <div class="row-title">Reset after idle</div>
            <div class="row-sub">step away this long to reset · 1–30 min</div>
          </div>
          <div class="field">
            <input
              id="idle"
              class="num"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              aria-label="Reset after idle, in minutes"
            />
            <span class="unit">min</span>
          </div>
        </div>

        <!-- Re-nudge every -->
        <div class="row">
          <div class="row-text">
            <div class="row-title">Re-nudge every</div>
            <div class="row-sub">while you keep working · 1–60 min</div>
          </div>
          <div class="field">
            <input
              id="renudge"
              class="num"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              aria-label="Re-nudge every, in minutes"
            />
            <span class="unit">min</span>
          </div>
        </div>

        <!-- Nudge style -->
        <div class="row stack">
          <div class="row-text">
            <div class="row-title">Nudge style</div>
            <div class="row-sub">how firmly Tomato asks you to step away</div>
          </div>
          <div class="seg" id="nudge-mode" role="radiogroup" aria-label="Nudge style">
            <button type="button" class="seg-opt" data-mode="soft" role="radio" aria-checked="false">
              <span class="seg-label">Soft</span>
              <span class="seg-sub">a quiet desktop notification</span>
            </button>
            <button type="button" class="seg-opt" data-mode="hard" role="radio" aria-checked="false">
              <span class="seg-label">Hard</span>
              <span class="seg-sub">a full-screen card, every time</span>
            </button>
            <button type="button" class="seg-opt" data-mode="escalating" role="radio" aria-checked="false">
              <span class="seg-label">Escalating</span>
              <span class="seg-sub">soft first, then full-screen</span>
            </button>
          </div>
        </div>

        <!-- Autostart -->
        <div class="row last">
          <div class="row-text">
            <div class="row-title">Autostart on login</div>
            <div class="row-sub">launch Tomato with your session</div>
          </div>
          <button
            type="button"
            class="toggle"
            id="autostart"
            role="switch"
            aria-checked="false"
            aria-label="Autostart on login"
          >
            <span class="knob"></span>
          </button>
        </div>
      </div>

      <div class="foot">
        <div class="foot-msg" id="msg" role="status" aria-live="polite"></div>
        <button type="button" class="btn ghost" id="cancel">Cancel</button>
        <button type="button" class="btn primary" id="save">Save</button>
      </div>
    </div>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
