<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomato — wrap up</title>
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <style>
      /* Transparent window ground so only the rounded card + shadow show. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        color: var(--text);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        /* small inset so the shadow isn't clipped by the window edge */
        padding: 6px;
      }
      .toast {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 4px solid var(--grace);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-card);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        animation: toast-in var(--duration-toast-in) var(--ease-out);
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .glyph {
        color: var(--grace);
        font-size: 20px;
        line-height: 1;
      }
      .body {
        flex: 1;
      }
      .title {
        font-size: 14.5px;
        font-weight: var(--weight-bold);
        color: var(--text);
      }
      .time {
        font-family: var(--font-mono);
        color: var(--grace);
      }
      .sub {
        font-size: 12.5px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      button {
        font-family: var(--font-display);
        font-size: 12.5px;
        font-weight: var(--weight-semibold);
        color: #fff;
        background: var(--grace);
        border: none;
        border-radius: var(--radius-sm);
        padding: 8px 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        filter: brightness(1.05);
      }
    </style>
  </head>
  <body>
    <div class="toast" role="status" aria-live="polite">
      <span class="glyph" aria-hidden="true">◑</span>
      <div class="body">
        <div class="title">Wrap up — break in <span class="time" id="grace-time">--:--</span></div>
        <div class="sub">Reach a stopping point when you're ready.</div>
      </div>
      <button id="break-now" type="button">Break now</button>
    </div>
    <script type="module" src="./grace-toast.ts"></script>
  </body>
</html>
