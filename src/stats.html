<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomato — stats</title>
    <!-- Critical: paint the themed background on first frame so the webview
         never flashes white before the external stylesheets load. -->
    <style>
      html { background: #f7f3ee; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { html { background: #171310; } }
    </style>
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/stats.css" />
  </head>
  <body>
    <div class="wrap">
      <!-- header -->
      <div class="head">
        <svg width="22" height="22" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="66" r="42" fill="none" stroke="var(--tomato)" stroke-width="12" stroke-linecap="round" stroke-dasharray="198 66" transform="rotate(-90 60 66)" />
          <line x1="60" y1="11" x2="60" y2="37" stroke="var(--leaf)" stroke-width="4.5" stroke-linecap="round" />
          <circle cx="60" cy="24" r="8" fill="var(--leaf)" />
        </svg>
        <div class="title">Today</div>
        <div class="date" id="date">—</div>
      </div>

      <!-- empty state -->
      <div class="empty" id="empty" hidden>
        <div class="empty-title">No presence yet</div>
        <div class="empty-sub">Start a sprint and your stats will show up here.</div>
      </div>

      <!-- content (hidden in the empty state) -->
      <div id="content">
        <!-- stat tiles -->
        <div class="tiles">
          <div class="tile active">
            <div class="cap">◷ Active</div>
            <div class="val" id="active">0m</div>
          </div>
          <div class="tile sprints">
            <div class="cap">● Sprints</div>
            <div class="val" id="sprints">0</div>
          </div>
          <div class="tile longest">
            <div class="cap">▲ Longest stretch</div>
            <div class="val" id="longest">0m</div>
          </div>
          <div class="tile breaks">
            <div class="cap">◼ Breaks</div>
            <div class="val" id="breaks">0<span class="sub"> no breaks</span></div>
          </div>
          <div class="tile adherence">
            <div class="cap">✦ Nudge adherence</div>
            <div class="val" id="adherence">—</div>
          </div>
        </div>

        <!-- 7-day chart -->
        <div class="charts">
          <div class="card week-card">
            <div class="card-title">This week · active minutes</div>
            <div class="bars" id="bars"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./stats.ts"></script>
  </body>
</html>
