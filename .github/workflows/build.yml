name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to full commit SHAs (tags are mutable); the
# trailing comment names the release. All JS actions run on Node 24.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pick the build matrix for this event. Linux always builds; the macOS leg
  # (billed 10x) builds only on v* tags and manual workflow_dispatch — never on
  # routine pull requests or main pushes. Emitted as JSON and consumed below via
  # fromJSON, because a static matrix cannot drop a leg per-event.
  setup:
    name: Select build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick legs for this event
        id: pick
        run: |
          LINUX='{"name":"linux","runner":"ubuntu-latest","rust_target":"x86_64-unknown-linux-gnu","bundles":"deb appimage"}'
          ARM='{"name":"macos-arm64","runner":"macos-14","rust_target":"aarch64-apple-darwin","bundles":"app dmg"}'
          # Staged — enable intel64 by defining INTEL and folding it into MAC (macOS runners bill 10x):
          # INTEL='{"name":"macos-intel","runner":"macos-13","rust_target":"x86_64-apple-darwin","bundles":"app dmg"}'
          MAC="$ARM"   # once intel is enabled: MAC="$ARM,$INTEL"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "matrix={\"include\":[$LINUX,$MAC]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$LINUX]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libxss-dev \
            libx11-dev

      # pnpm version comes from package.json "packageManager" (exact pin, same as
      # local). A floating major here (`version: 11`) is how CI drifted onto a
      # pnpm release that dropped onlyBuiltDependencies and broke install.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Scope by target triple so the (future) two macOS legs — arm64 and
          # intel, both runner.os == macOS — don't share/pollute one cache key.
          key: ${{ matrix.rust_target }}

      - name: Cache Tauri bundler helpers (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tauri
          key: ${{ runner.os }}-tauri-cache-${{ hashFiles('src-tauri/tauri.conf.json') }}
          restore-keys: |
            ${{ runner.os }}-tauri-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test + typecheck (Linux leg only — the core is pure/OS-independent)
        if: runner.os == 'Linux'
        run: |
          pnpm test
          npx tsc --noEmit
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri bundle
        run: pnpm tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

      - name: Package .app.tar.gz (macOS)
        # Requires `app` in this leg's matrix.bundles (produces bundle/macos/Tomato.app).
        if: runner.os == 'macOS'
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "${{ matrix.rust_target }}" in
            aarch64-apple-darwin) ARCH=aarch64 ;;
            x86_64-apple-darwin)  ARCH=x64 ;;
            *) ARCH=unknown ;;
          esac
          BDIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos"
          tar -C "$BDIR" -czf "$BDIR/Tomato_${VERSION}_${ARCH}.app.tar.gz" "Tomato.app"

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tomato-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tomato-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app.tar.gz

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.dmg
            dist/**/*.app.tar.gz
          body: |
            ## Install

            **Linux** — `.AppImage` (`chmod +x` and run) or `.deb` (`sudo apt install ./Tomato_*.deb`).

            **macOS** — this build is **not signed** (no Apple Developer account), so
            macOS Gatekeeper blocks the first launch. Pick your chip:

            - Apple Silicon (M1/M2/M3…): `*_aarch64.dmg` (or `*_aarch64.app.tar.gz`)
            - Intel: `*_x64.dmg` (or `*_x64.app.tar.gz`) — available once the intel leg is enabled

            Move **Tomato.app** to `/Applications`, then run once:

            ```
            xattr -cr /Applications/Tomato.app
            ```

            and open it normally. (Equivalent: right-click Tomato.app → **Open** → **Open**.)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
